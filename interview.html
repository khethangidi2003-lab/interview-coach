<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Coach — Interview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">
            <div class="header-top">
                <div class="header-brand">
                <div class="header-brand">
                    <a href="index.html" class="logo-link">
                        <img src="logo.png" alt="Interview Coach" class="logo-img-small">
                    </a>
                    <div>
                        <div class="header-subtitle">AI-powered interview preparation</div>
                    </div>
                </div>
                </div>
                <a href="index.html" class="btn btn-outline" style="padding: 6px 16px; font-size: 0.8rem; min-height: auto;">← Home</a>
            </div>
        </header>

        <!-- INTERVIEW -->
        <section class="section" id="interviewSection">
            <div class="interview-header">
                <h3 id="questionCounter">Question 1 of 7</h3>
                <button id="endInterviewBtn" class="btn btn-outline" style="display: none;">Exit Interview</button>
            </div>

            <!-- Camera -->
            <div class="camera-container" id="cameraContainer" style="display: none;">
                <div class="video-wrapper">
                    <video id="videoElement" class="video-feed" autoplay playsinline></video>
                    <canvas id="canvasElement" class="canvas-overlay"></canvas>
                </div>
                <div class="focus-stats">
                    <div class="stat-item">
                        <span class="stat-label">Focus</span>
                        <span id="focusScore" class="stat-value">--%</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Gaze</span>
                        <span id="gazeDirection" class="stat-value">--</span>
                    </div>
                    <div id="focusNudge" class="focus-nudge" style="display: none;"></div>
                </div>
            </div>

            <!-- Question -->
            <div id="currentQuestion" class="question-display">
                Click "Start Interview" to begin.
            </div>

            <!-- Answer -->
            <div id="answerDisplay" class="answer-display" style="display: none;">
                <label>Your Response</label>
                <div id="answerText" class="answer-text">Waiting for you to speak...</div>
            </div>

            <!-- Controls -->
            <div class="btn-group">
              <button id="startInterviewBtn" class="btn btn-accent">Start Interview</button>
              <button id="startListeningBtn" style="display: none;" class="btn btn-accent">Start Listening</button>
              <button id="stopListeningBtn" style="display: none;" class="btn btn-danger">Stop</button>
              <button id="nextQuestionBtn" style="display: none;" class="btn btn-primary">Next Question</button>
              <button id="endInterviewBtn" class="btn btn-danger" style="display: none;">Exit Interview</button>
            </div>

            <!-- Status -->
            <div id="statusMessage" class="status"></div>
        </section>

    </div>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <script src="face-detection.js"></script>
    <script src="script.js"></script>
</body>
</html>

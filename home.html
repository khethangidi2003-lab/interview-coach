<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Coach — AI-Powered Practice</title>
    <link rel="icon" type="image/png" href="browserLogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HERO BANNER -->
    <section class="hero">
        <div class="hero-image">
            <img src="background.jpg" alt="AI Interview Coach" loading="lazy">
        </div>
        <div class="hero-overlay">
            <h2>Practice Interviews with AI</h2>
            <p>Get real-time feedback and improve your interview skills</p>
        </div>
    </section>
    
    <div class="app">

        <!-- HEADER -->
        <header class="header">
            <div class="header-top">
                <div class="header-brand">
                    <a href="index.html" class="logo-link">
                        <img src="logo.png" alt="Interview Coach" class="logo-img-small">
                    </a>
                    <div>
                        <div class="header-subtitle">AI-powered interview preparation</div>
                    </div>
                </div>
                <nav class="nav-links">
                    <a href="index.html" class="active">Home</a>
                    <a href="faq.html">FAQ</a>
                </nav>
            </div>
        </header>

        <!-- LOADING OVERLAY -->
<div id="loadingOverlay" class="loading-overlay" style="display: none;">
    <div class="loading-content">
        <img src="loading/loading1.svg" alt="Loading" class="loading-icon">
        <p id="loadingText">Loading...</p>
        <p class="loading-sub" id="loadingSub">Please wait</p>
    </div>
</div>

        <!-- SETUP: Job Description -->
        <section class="section" id="jdSection">
            <div class="section-label">Job Context</div>
            <div class="form-group">
                <label for="jobDescription">Job Description</label>
                <textarea id="jobDescription" placeholder="Paste a job description OR role name/type..."></textarea>
            </div>
            <button id="generateBtn" class="btn btn-primary">Generate Interview</button>
        </section>

    </div>

    <script src="script.js"></script>
</body>
<!-- LOADING OVERLAY -->
<div id="loadingOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,22,40,0.8); z-index: 99999; display: none; align-items: center; justify-content: center; flex-direction: column;">
    <img src="loading/loading3.svg" alt="Loading" id="loadingIcon" style="width: 80px; height: 80px; animation: pulse 1.5s ease-in-out infinite;">
    <p id="loadingText" style="color: white; font-size: 1.2rem; margin-top: 16px; font-weight: 500;">Loading...</p>
    <p id="loadingSub" style="color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-top: 4px;">Please wait</p>
</div>

<style>
    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.8; }
    }
</style>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Coach — Results</title>
    <link rel="icon" type="image/png" href="browserLogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">
            <div class="header-top">
                <div class="header-brand">
                    <a href="index.html" class="logo-link">
                        <img src="logo.png" alt="Interview Coach" class="logo-img-small">
                    </a>
                    <div>
                        <div class="header-subtitle">AI-powered interview preparation</div>
                    </div>
                </div>
                <div class="nav-buttons">
                    <a href="home.html" class="btn btn-outline btn-mobile" id="backNavBtn">← Back</a>
                    <a href="index.html" class="btn btn-outline btn-mobile" id="homeNavBtn">Home</a>
                </div>
            </div>
        </header>

        <!-- RESULTS -->
        <section class="section results-section">
            <div class="results-header">
                <h2>Interview Summary</h2>
                <span class="results-date" id="resultsDate"></span>
            </div>
            
            <div id="questionsContainer" class="questions-container"></div>

            <div id="feedbackSection" style="display: none;">
                <div class="feedback-divider"></div>
                <h3 class="feedback-title">AI Feedback</h3>
                <div id="feedbackContent" class="feedback-content"></div>
            </div>

            <div class="results-actions">
                <button id="getFeedbackBtn" class="btn btn-accent">Get Feedback</button>
                <button id="exportPdfBtn" class="btn btn-outline" style="display: none;">Export PDF</button>
                <a href="index.html" class="btn btn-outline">Home</a>
            </div>
        </section>

    </div>

    <!-- FOOTER -->
    <footer class="landing-footer">
        <div class="footer-inner">
            <p class="footer-credit">
                © 2026 Interview Coach — Created by <strong>Khetha Ngidi</strong>
            </p>
            <div class="footer-links">
                <a id="privacyLink" href="#">Privacy Policy</a>
                <a id="termsLink" href="#">Terms of Service</a>
                <a id="contactLink" href="#">Contact</a>
            </div>
        </div>
    </footer>

    <!-- jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="script.js"></script>
</body>
</html>

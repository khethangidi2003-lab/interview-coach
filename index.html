<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Coach — AI-Powered Interview Practice</title>
    <link rel="icon" type="image/png" href="browserLogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============================================ -->
    <!-- LANDING PAGE — Video Background              -->
    <!-- ============================================ -->

    <div class="landing-page">

        <!-- VIDEO BACKGROUND -->
        <div class="video-background">
            <video autoplay muted loop playsinline>
                <source src="video.mp4" type="video/mp4">
                <!-- Fallback image if video doesn't load -->
                <img src="background.jpg" alt="Interview Coach">
            </video>
            <div class="video-overlay"></div>
        </div>

        <!-- HEADER -->
        <header class="landing-header">
            <div class="landing-header-inner">
                <!-- Logo — Clickable, refreshes to home.html -->
                <a href="index.html" class="logo-link">
                <img src="logo.PNG" alt="Interview Coach" class="logo-img">
                </a>
                <nav class="landing-nav">
                    <a href="home.html" class="nav-link nav-try-it">Try It Out</a>
                    <a href="faq.html" class="nav-link">FAQ</a>
                </nav>
            </div>
        </header>

        <!-- HERO CONTENT -->
        <section class="landing-hero">
            <div class="hero-content">
                <h1 class="hero-title">
                    <span class="typing-text">Practice Interviews with AI</span>
                    <span class="hero-subtitle">For Any Job, Anywhere in the World</span>
                </h1>
                <p class="hero-description">
                    Get real-time feedback on your answers and body language. 
                    Build confidence and walk into any interview prepared.
                </p>
                <a href="home.html" class="btn-gold-animated">
                    Try It Out
                    <span class="btn-glow"></span>
                </a>
            </div>
        </section>

        <!-- FOOTER -->
        <footer class="landing-footer">
            <div class="footer-inner">
                <p class="footer-credit">
                    © 2026 Interview Coach — Created by <strong>Khetha Ngidi</strong>
                </p>
                <div class="footer-links">
                    <a href="#">Privacy Policy</a>
                    <a href="#">Terms of Service</a>
                    <a href="#">Contact</a>
                </div>
            </div>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
